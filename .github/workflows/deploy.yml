name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # كل 6 ساعات علشان صفحات الـ SEO تتحدث بالأسعار الجديدة (المرحلة 12)
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check (syntax + unit tests)
        run: node tools/check.mjs

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build _site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          mkdir -p _site
          # الملفات اللي بتتنشر بس (من غير docs و tests و tools)
          cp -r index.html 404.html manifest.webmanifest sw.js robots.txt firebase-config.js \
                assets js data _site/
          for f in *.html; do cp "$f" _site/; done
          [ -d admin ] && cp -r admin _site/ || true
          # صفحة 404 لازم تعرف المسار الحقيقي للموقع (مثلاً /STORE/)
          sed -i "s#<base href=\"/\">#<base href=\"${BASE_PATH%/}/\">#" _site/404.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
